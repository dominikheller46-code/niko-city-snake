<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><title>NIKO CITY SNAKE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0B0E14;color:#F4E8D0;font-family:Trebuchet MS,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.brand b{display:block;letter-spacing:.14em;font-size:12px;color:#F4C95D}
.brand span{font-size:10px;opacity:.65}
.stats{display:flex;gap:6px;font-size:12px}
.stat{border:1px solid rgba(244,201,93,.22);border-radius:8px;padding:4px 7px;min-width:48px;text-align:center}
.stat em{display:block;font-style:normal;opacity:.5;font-size:8px}
.stat b{color:#F4C95D}
#wrap{flex:1;width:100%;max-width:460px;display:flex;align-items:center;justify-content:center;padding:0 8px;position:relative}
canvas{width:100%;height:auto;max-height:calc(100dvh - 96px);border-radius:12px}
#overlay{position:absolute;inset:0 8px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.card{pointer-events:auto;width:min(92%,360px);background:#120F0E;border:1px solid rgba(244,201,93,.35);border-radius:16px;padding:20px 16px;text-align:center}
.card h1{margin:0 0 8px;color:#F4C95D;letter-spacing:.1em}
button{border:0;background:#F4C95D;color:#1A1612;font-weight:800;letter-spacing:.12em;font-size:16px;padding:12px 26px;border-radius:999px}
button.ghost{background:transparent;color:#F4E8D0;border:1px solid rgba(232,213,181,.35);margin-top:8px}
footer{padding:0 12px 10px;font-size:11px;opacity:.55;text-align:center}
.hidden{display:none!important}
</style></head><body>
<div id="app"><header><div class="brand"><b>NIKO CITY SNAKE</b><span id="wallName">stěna: průčelí</span></div>
<div class="stats"><div class="stat"><em>SKÓRE</em><b id="sc">0</b></div><div class="stat"><em>OKNA</em><b id="li">0</b></div><div class="stat"><em>NEJ</em><b id="hi">0</b></div></div></header>
<div id="wrap"><canvas id="c" width="400" height="740"></canvas>
<div id="overlay"><div class="card" id="menu"><h1>PANELÁK</h1><p>Had leze pomalu po oknech. Na rohu přeleze na další stěnu a kamera se otočí. Táhni prstem.</p>
<button id="play">HRÁT</button><br><button class="ghost" id="tiltBtn">Zapnout náklon</button></div>
<div class="card hidden" id="over"><h1 id="overTitle">TMA</h1><p id="overTxt"></p><button id="again">HRÁT ZNOVU</button></div></div></div>
<footer>táhni prstem · na rohu se dům otočí</footer></div>
<script>
(function(){
const COLS=6,ROWS=9,FACES=4,NAMES=['průčelí','bok k silnici','dvůr','bok k parku'],FACE_COL=['#6E6A60','#5E675C','#6A5E54','#5A6168'];
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const scEl=document.getElementById('sc'),liEl=document.getElementById('li'),hiEl=document.getElementById('hi'),wallName=document.getElementById('wallName');
const menu=document.getElementById('menu'),over=document.getElementById('over'),overlay=document.getElementById('overlay');
const BEST_KEY='niko-city-snake-best';let best=Number(localStorage.getItem(BEST_KEY)||0);hiEl.textContent=best;
const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]},OPP={U:'D',D:'U',L:'R',R:'L'};
let state='menu',snake,dir,face,items,shutters,lit,score,lights,tickMs,acc,last,particles;
let touchCell=null,touching=false,tilt={x:0,y:0,on:false},grace=0,cam={from:0,to:0,t:1,dir:1};
let layout={ox:0,oy:0,cw:40,ch:48,bw:0,bh:0};
function beep(freq,dur,type,vol){try{const ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(dur||.08));o.stop(ac.currentTime+(dur||.08)+.02)}catch(e){}}
function resize(){const wrap=document.getElementById('wrap');const w=Math.max(280,wrap.clientWidth),h=Math.max(440,wrap.clientHeight);canvas.width=w|0;canvas.height=h|0;const padX=w*.14,padTop=h*.09,padBot=h*.1;layout.bw=w-padX*2;layout.bh=h-padTop-padBot;layout.ox=padX;layout.oy=padTop;layout.cw=layout.bw/COLS;layout.ch=layout.bh/ROWS}window.addEventListener('resize',resize);resize();
function emptyLit(){const L=[];for(let f=0;f<FACES;f++){L[f]=[];for(let y=0;y<ROWS;y++){L[f][y]=[];for(let x=0;x<COLS;x++)L[f][y][x]=false}}return L}
function occupied(f,x,y){return snake.some(s=>s.f===f&&s.x===x&&s.y===y)||items.some(i=>i.f===f&&i.x===x&&i.y===y)||shutters.some(s=>s.f===f&&s.x===x&&s.y===y)}
function reset(){face=0;const sy=ROWS>>1;snake=[{f:0,x:2,y:sy},{f:0,x:2,y:sy+1},{f:0,x:2,y:sy+2}];dir='U';score=0;lights=0;tickMs=430;acc=0;grace=12;particles=[];lit=emptyLit();shutters=[];items=[];cam={from:0,to:0,t:1,dir:1};spawnItem('lamp');spawnItem('lamp');spawnItem('roll');updateHud()}
function spawnItem(kind){const free=[];for(let f=0;f<FACES;f++)for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!occupied(f,x,y))free.push({f,x,y});if(!free.length)return;const p=free[(Math.random()*free.length)|0];items.push({f:p.f,x:p.x,y:p.y,kind:kind||(Math.random()<.14?'car':Math.random()<.4?'roll':'lamp')})}
function burst(f,x,y,color){for(let i=0;i<10;i++)particles.push({f,x:x+.5,y:y+.5,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:1,color})}
function updateHud(){scEl.textContent=score;liEl.textContent=lights;wallName.textContent='stěna: '+NAMES[face];if(score>best){best=score;localStorage.setItem(BEST_KEY,String(best))}hiEl.textContent=best}
function startTurn(nextFace,side){cam.from=face;cam.to=nextFace;cam.dir=side;cam.t=0;face=nextFace;updateHud();beep(320,.09,'triangle',.03)}
function start(){if(beep.ac&&beep.ac.state==='suspended')beep.ac.resume();reset();state='play';menu.classList.add('hidden');over.classList.add('hidden');overlay.style.pointerEvents='none';last=performance.now();beep(440,.07);beep(660,.1)}
function die(win){state='over';overlay.style.pointerEvents='auto';over.classList.remove('hidden');document.getElementById('overTitle').textContent=win?'DŮM SVÍTÍ':'ZAMOTALA SES';document.getElementById('overTxt').textContent=win?('Čtyři stěny svítí. Skóre '+score+'.'):('Had se kousl. Skóre '+score+' · oken '+lights+'.');beep(win?523:170,.16,'triangle',.05)}
function nextPos(f,x,y,d){const nx=x+DIR[d][0],ny=y+DIR[d][1];if(ny<0||ny>=ROWS)return{blocked:true};if(nx>=COLS)return{f:(f+1)%FACES,x:0,y,turn:1};if(nx<0)return{f:(f+3)%FACES,x:COLS-1,y,turn:-1};return{f,x:nx,y:ny,turn:0}}
function pickDir(){const head=snake[0];let tx=head.x,ty=head.y,has=false;if(touching&&touchCell){tx=touchCell.x;ty=touchCell.y;has=true}else if(tilt.on&&(Math.abs(tilt.x)>.28||Math.abs(tilt.y)>.28)){tx=head.x+(tilt.x>.28?1:tilt.x<-.28?-1:0);ty=head.y+(tilt.y>.28?1:tilt.y<-.28?-1:0);has=true}if(!has)return dir;const dx=tx-head.x,dy=ty-head.y;if(!dx&&!dy)return dir;const cand=[];if(Math.abs(dx)>=Math.abs(dy)){cand.push(dx>0?'R':'L');if(dy)cand.push(dy>0?'D':'U')}else{cand.push(dy>0?'D':'U');if(dx)cand.push(dx>0?'R':'L')}cand.push(dir);for(const d of cand){if(d===OPP[dir]&&snake.length>2)continue;const n=nextPos(head.f,head.x,head.y,d);if(n.blocked)continue;if(shutters.some(s=>s.f===n.f&&s.x===n.x&&s.y===n.y))continue;if(grace<=0&&snake.some((s,i)=>i!==snake.length-1&&s.f===n.f&&s.x===n.x&&s.y===n.y))continue;return d}return dir}
function lightNear(f,x,y){const cells=[{f,x,y}];[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const p=nextPos(f,x,y,dx>0?'R':dx<0?'L':dy>0?'D':'U');if(!p.blocked)cells.push({f:p.f,x:p.x,y:p.y})});for(const c of cells){if(!lit[c.f][c.y][c.x]){lit[c.f][c.y][c.x]=true;lights++;burst(c.f,c.x,c.y,'#F4C95D');break}}}
function step(){if(cam.t<1)return;if(grace>0)grace--;dir=pickDir();const head=snake[0];let n=nextPos(head.f,head.x,head.y,dir);if(n.blocked||shutters.some(s=>s.f===n.f&&s.x===n.x&&s.y===n.y)){const order=['U','D','L','R'].filter(d=>d!==OPP[dir]);let found=null;for(const d of order){const alt=nextPos(head.f,head.x,head.y,d);if(alt.blocked)continue;if(shutters.some(s=>s.f===alt.f&&s.x===alt.x&&s.y===alt.y))continue;if(snake.some((s,i)=>i!==snake.length-1&&s.f===alt.f&&s.x===alt.x&&s.y===alt.y))continue;found={d,n:alt};break}if(!found)return;dir=found.d;n=found.n}if(grace<=0&&snake.some((s,i)=>i!==snake.length-1&&s.f===n.f&&s.x===n.x&&s.y===n.y)){die(false);return}if(n.turn)startTurn(n.f,n.turn);snake.unshift({f:n.f,x:n.x,y:n.y});const hit=items.findIndex(i=>i.f===n.f&&i.x===n.x&&i.y===n.y);let grow=false;if(hit>=0){const it=items[hit];items.splice(hit,1);if(it.kind==='lamp'){score+=12;grow=true;lightNear(n.f,n.x,n.y);beep(700,.07)}else if(it.kind==='roll'){score+=6;grow=true;snake.push({...snake[snake.length-1]});beep(400,.06)}else{score+=22;grow=true;tickMs=Math.max(280,tickMs-8);beep(820,.08,'sawtooth',.025)}burst(n.f,n.x,n.y,'#F4C95D');spawnItem();updateHud();tickMs=Math.max(280,tickMs-.4)}if(!grow)snake.pop()}
function cellAt(px,py){const x=Math.floor((px-layout.ox)/layout.cw),y=Math.floor((py-layout.oy)/layout.ch);if(x<0||y<0||x>=COLS||y>=ROWS)return null;return{x,y}}
function drawFaceWindows(fid,x0,y0,w,h,shade){const cw=w/COLS,ch=h/ROWS;ctx.fillStyle=FACE_COL[fid];ctx.fillRect(x0-6,y0-6,w+12,h+12);ctx.fillStyle=shade;ctx.fillRect(x0-6,y0-6,w+12,h+12);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const px=x0+x*cw,py=y0+y*ch,wx=px+4,wy=py+5,ww=cw-8,wh=ch-12;ctx.fillStyle=(x+y)%2?FACE_COL[fid]:'#58544C';ctx.fillRect(px+1,py+1,cw-2,ch-2);const isLit=lit[fid][y][x];ctx.fillStyle=isLit?'#3D2C12':'#16141C';ctx.fillRect(wx,wy,ww,wh);if(isLit){ctx.fillStyle='rgba(244,201,93,.55)';ctx.fillRect(wx+1,wy+1,ww-2,wh-2)}}
for(const it of items){if(it.f!==fid)continue;const px=x0+it.x*cw+cw/2,py=y0+it.y*ch+ch/2;ctx.fillStyle=it.kind==='lamp'?'#F4C95D':'#C4A574';ctx.beginPath();ctx.arc(px,py,it.kind==='lamp'?5:6,0,7);ctx.fill()}
for(let i=snake.length-1;i>=0;i--){const p=snake[i];if(p.f!==fid)continue;const cx=x0+p.x*cw+cw/2,cy=y0+p.y*ch+ch/2;ctx.fillStyle=i===0?'#E8D5B5':i%2?'#C4A574':'#A88858';ctx.beginPath();ctx.arc(cx,cy,i===0?10:8.4,0,7);ctx.fill();if(i===0){ctx.strokeStyle='#2A6B6B';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,10,0,7);ctx.stroke()}}}
function draw(){const w=canvas.width,h=canvas.height,g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0A1220');g.addColorStop(1,'#1A1612');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const{ox,oy,bw,bh}=layout;const turning=cam.t<1;const t=turning?(0.5-0.5*Math.cos(cam.t*Math.PI)):1;ctx.fillStyle='#2A2620';ctx.fillRect(ox-18,oy+bh+4,bw+50,16);if(!turning){drawFaceWindows(face,ox,oy,bw,bh,'rgba(0,0,0,0)');const sideW=Math.max(16,bw*.12),nextF=(face+1)%FACES;ctx.save();ctx.beginPath();ctx.moveTo(ox+bw+6,oy-4);ctx.lineTo(ox+bw+6+sideW,oy+10);ctx.lineTo(ox+bw+6+sideW,oy+bh-10);ctx.lineTo(ox+bw+6,oy+bh+4);ctx.closePath();ctx.clip();drawFaceWindows(nextF,ox+bw+6,oy+8,sideW+8,bh-16,'rgba(0,0,0,.35)');ctx.restore()}else{const dirS=cam.dir>=0?1:-1;if(t<.5){const sc=Math.max(.04,Math.cos(t*Math.PI));drawFaceWindows(cam.from,dirS>0?ox:ox+bw*(1-sc),oy,bw*sc,bh,'rgba(0,0,0,.2)')}else{const sc=Math.max(.04,Math.sin(t*Math.PI));drawFaceWindows(cam.to,dirS>0?ox+bw*(1-sc):ox,oy,bw*sc,bh,'rgba(0,0,0,.2)')}ctx.fillStyle='#F4C95D';ctx.font='bold 13px Trebuchet MS';ctx.textAlign='center';ctx.fillText('otáčím na '+NAMES[cam.to],canvas.width/2,oy-12)}ctx.fillStyle='#F4C95D';ctx.font='bold 10px Trebuchet MS';ctx.textAlign='center';ctx.fillText('NIKO · '+NAMES[face].toUpperCase(),ox+bw/2,oy-11);if(touching&&touchCell&&state==='play'&&cam.t>=1){const tx=layout.ox+touchCell.x*layout.cw+layout.cw/2,ty=layout.oy+touchCell.y*layout.ch+layout.ch/2;ctx.strokeStyle='rgba(244,201,93,.45)';ctx.beginPath();ctx.arc(tx,ty,15,0,7);ctx.stroke()}}
function loop(now){requestAnimationFrame(loop);if(!last)last=now;const dt=Math.min(50,now-last);last=now;if(state==='play'){if(cam.t<1)cam.t=Math.min(1,cam.t+dt/720);else{acc+=dt;while(acc>=tickMs){acc-=tickMs;step();if(state!=='play')break}}for(const pt of particles){pt.x+=pt.vx*dt/420;pt.y+=pt.vy*dt/420;pt.life-=dt/520}particles=particles.filter(p=>p.life>0)}draw()}requestAnimationFrame(loop);
function pointerToCell(e){const r=canvas.getBoundingClientRect();return cellAt(((e.clientX-r.left)/r.width)*canvas.width,((e.clientY-r.top)/r.height)*canvas.height)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);touching=true;touchCell=pointerToCell(e);if(state==='menu')start()},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!touching)return;const c=pointerToCell(e);if(c)touchCell=c},{passive:true});
canvas.addEventListener('pointerup',()=>touching=false);
document.getElementById('tiltBtn').onclick=async ev=>{ev.stopPropagation();try{if(DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')return}window.addEventListener('deviceorientation',e=>{tilt.x=Math.max(-1,Math.min(1,(e.gamma||0)/30));tilt.y=Math.max(-1,Math.min(1,((e.beta||45)-45)/30))});tilt.on=true;document.getElementById('tiltBtn').textContent='Náklon zapnutý'}catch(err){}};
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;reset();draw();
})();
</script></body></html>
