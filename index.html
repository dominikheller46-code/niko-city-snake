<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1A1612" />
  <title>NIKO CITY SNAKE — Rozsviť město</title>
  <style>
    :root { --ink:#1A1612; --kraft:#C4A574; --gold:#F4C95D; --cream:#F4E8D0; --night:#120F0C; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; height:100%; background:var(--night); color:var(--cream); font-family:"Trebuchet MS","Segoe UI",sans-serif; overflow:hidden; touch-action:none; user-select:none; }
    #app { height:100%; display:flex; flex-direction:column; align-items:center; }
    header { width:100%; max-width:720px; display:flex; justify-content:space-between; align-items:center; padding:10px 14px 6px; gap:8px; }
    .brand b { letter-spacing:.16em; font-size:13px; color:var(--gold); display:block; }
    .brand span { font-size:11px; opacity:.7; }
    .stats { display:flex; gap:10px; font-size:12px; font-variant-numeric:tabular-nums; }
    .stat { background:rgba(196,165,116,.12); border:1px solid rgba(196,165,116,.28); border-radius:8px; padding:5px 8px; min-width:58px; text-align:center; }
    .stat em { display:block; font-style:normal; opacity:.55; font-size:9px; letter-spacing:.08em; }
    .stat b { color:var(--gold); }
    #wrap { flex:1; width:100%; max-width:720px; display:flex; align-items:center; justify-content:center; padding:4px 10px 8px; position:relative; }
    canvas { display:block; width:100%; height:auto; max-height:calc(100dvh - 118px); background:#1E1A16; border-radius:14px; box-shadow:0 0 0 1px rgba(196,165,116,.22),0 18px 40px rgba(0,0,0,.45); }
    #overlay { position:absolute; inset:4px 10px 8px; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .card { pointer-events:auto; width:min(92%,380px); background:linear-gradient(180deg,rgba(26,22,18,.94),rgba(18,15,12,.96)); border:1px solid rgba(244,201,93,.35); border-radius:16px; padding:22px 20px 18px; text-align:center; }
    .card h1 { margin:0 0 6px; font-size:22px; letter-spacing:.12em; color:var(--gold); }
    .card p { margin:0 0 16px; opacity:.8; font-size:14px; line-height:1.4; }
    .hint { font-size:12px; opacity:.55; margin-top:10px !important; }
    button { appearance:none; border:0; background:var(--gold); color:var(--ink); font-weight:800; letter-spacing:.14em; font-size:16px; padding:12px 28px; border-radius:999px; cursor:pointer; }
    button.ghost { background:transparent; color:var(--cream); border:1px solid rgba(232,213,181,.35); margin-left:8px; }
    footer { width:100%; max-width:720px; padding:0 14px 12px; display:flex; justify-content:space-between; align-items:center; font-size:11px; opacity:.55; }
    .pads { display:none; gap:6px; }
    @media (pointer:coarse){ .pads{display:flex;} }
    .pads button { width:44px; height:36px; padding:0; font-size:14px; letter-spacing:0; background:rgba(196,165,116,.18); color:var(--cream); border-radius:8px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand"><b>NIKO CITY SNAKE</b><span>Rozsviť město · ruličky M1</span></div>
      <div class="stats">
        <div class="stat"><em>SKÓRE</em><b id="sc">0</b></div>
        <div class="stat"><em>SVĚTLA</em><b id="li">0</b></div>
        <div class="stat"><em>NEJ</em><b id="hi">0</b></div>
      </div>
    </header>
    <div id="wrap">
      <canvas id="c" width="720" height="720"></canvas>
      <div id="overlay">
        <div class="card" id="menu">
          <h1>NIKO CITY</h1>
          <p>Had z dutinek projíždí nočním městem. Sbírej žárovky a rozsvěcuj okna. Náraz do domu nebo do sebe končí tmu.</p>
          <button id="play">HRÁT</button>
          <p class="hint">Swipe · šipky · WASD<br>NASAD. POOTOČ. STAV DÁL.</p>
        </div>
        <div class="card hidden" id="over">
          <h1 id="overTitle">TMA</h1>
          <p id="overTxt"></p>
          <button id="again">HRÁT ZNOVU</button>
          <button class="ghost" id="home">MENU</button>
        </div>
      </div>
    </div>
    <footer>
      <span>svět Město · unisex</span>
      <div class="pads">
        <button data-d="L">←</button><button data-d="U">↑</button><button data-d="D">↓</button><button data-d="R">→</button>
      </div>
      <span>bez serveru</span>
    </footer>
  </div>
<script>
(function(){
const COLS=21,ROWS=21;
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const scEl=document.getElementById("sc");
const liEl=document.getElementById("li");
const hiEl=document.getElementById("hi");
const menu=document.getElementById("menu");
const over=document.getElementById("over");
const overlay=document.getElementById("overlay");
const BEST_KEY="niko-city-snake-best";
let best=Number(localStorage.getItem(BEST_KEY)||0);
hiEl.textContent=best;
const DIR={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
const OPP={U:"D",D:"U",L:"R",R:"L"};
let state="menu",snake,dir,queued,items,buildings,score,lights,tickMs,acc,last,particles,cell=24;
function isStreet(x,y){return x%3===0||y%3===0;}
function resize(){
  const wrap=document.getElementById("wrap");
  const w=Math.min(wrap.clientWidth,wrap.clientHeight);
  const size=Math.max(280,Math.floor(w));
  canvas.width=size; canvas.height=size; cell=size/COLS;
}
window.addEventListener("resize",resize); resize();
function beep(freq,dur,type,vol){
  try{
    const ac=beep.ac||(beep.ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"square"; o.frequency.value=freq; g.gain.value=vol||0.05;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+(dur||0.08));
    o.stop(ac.currentTime+(dur||0.08)+0.02);
  }catch(e){}
}
function reset(){
  const mid=10;
  snake=[{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
  dir="R"; queued="R"; score=0; lights=0; tickMs=168; acc=0; particles=[];
  buildings=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(!isStreet(x,y)) buildings.push({x,y,lit:false,hue:(x*7+y*13)%3});
  items=[]; spawnItem("lamp"); spawnItem("lamp"); spawnItem("roll"); updateHud();
}
function occupied(x,y){return snake.some(s=>s.x===x&&s.y===y)||items.some(i=>i.x===x&&i.y===y);}
function spawnItem(kind){
  const free=[];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) if(isStreet(x,y)&&!occupied(x,y)) free.push({x,y});
  if(!free.length) return;
  const p=free[(Math.random()*free.length)|0];
  items.push({x:p.x,y:p.y,kind:kind||(Math.random()<0.18?"car":Math.random()<0.45?"roll":"lamp")});
}
function lightNearest(from){
  let bestB=null,bestD=1e9;
  for(const b of buildings){ if(b.lit) continue; const d=Math.abs(b.x-from.x)+Math.abs(b.y-from.y); if(d<bestD){bestD=d;bestB=b;} }
  if(bestB){ bestB.lit=true; lights++; burst(bestB.x+0.5,bestB.y+0.5,"#F4C95D"); return true; }
  return false;
}
function burst(x,y,color){ for(let i=0;i<14;i++) particles.push({x,y,vx:(Math.random()-0.5)*3.2,vy:(Math.random()-0.5)*3.2,life:1,color}); }
function updateHud(){
  scEl.textContent=score; liEl.textContent=lights;
  if(score>best){ best=score; localStorage.setItem(BEST_KEY,String(best)); }
  hiEl.textContent=best;
}
function start(){
  reset(); state="play"; menu.classList.add("hidden"); over.classList.add("hidden");
  overlay.style.pointerEvents="none"; last=performance.now(); beep(440,0.07); beep(660,0.1);
}
function die(win){
  state="over"; overlay.style.pointerEvents="auto"; over.classList.remove("hidden");
  document.getElementById("overTitle").textContent=win?"MĚSTO SVÍTÍ":"TMA";
  document.getElementById("overTxt").textContent=win
    ?("Všechna okna hoří. Skóre "+score+" · světla "+lights+".")
    :("Had z ruliček se zastavil. Skóre "+score+" · rozsvíceno "+lights+" oken.");
  beep(win?523:160,0.18,"triangle",0.06); if(win) beep(784,0.22,"triangle",0.05);
}
function step(){
  dir=queued; const [dx,dy]=DIR[dir]; const head=snake[0]; const nx=head.x+dx, ny=head.y+dy;
  if(nx<0||ny<0||nx>=COLS||ny>=ROWS||!isStreet(nx,ny)||snake.some(s=>s.x===nx&&s.y===ny)){ die(false); return; }
  snake.unshift({x:nx,y:ny});
  const hit=items.findIndex(i=>i.x===nx&&i.y===ny);
  let grow=false;
  if(hit>=0){
    const it=items[hit]; items.splice(hit,1);
    if(it.kind==="lamp"){ score+=12; grow=true; lightNearest(it); beep(720,0.07); }
    else if(it.kind==="roll"){ score+=6; grow=true; snake.push({...snake[snake.length-1]}); beep(420,0.06); }
    else { score+=28; grow=true; tickMs=Math.max(92,tickMs-10); beep(880,0.09,"sawtooth",0.035); }
    burst(nx+0.5,ny+0.5,it.kind==="car"?"#C45C26":"#F4C95D");
    spawnItem(); if(items.length<3) spawnItem(); updateHud();
    if(buildings.every(b=>b.lit)){ score+=80; updateHud(); die(true); return; }
    tickMs=Math.max(92,tickMs-1.2);
  }
  if(!grow) snake.pop();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function draw(){
  ctx.fillStyle="#1C1814"; ctx.fillRect(0,0,canvas.width,canvas.height);
  const s=cell;
  for(const b of buildings){
    const px=b.x*s, py=b.y*s;
    ctx.fillStyle=b.lit?"#3A2E22":"#2A241E"; ctx.fillRect(px+1,py+1,s-2,s-2);
    ctx.fillStyle=b.lit?(b.hue===0?"#F4C95D":b.hue===1?"#E8D5B5":"#F0A35A"):"#161310";
    const m=s*0.22;
    ctx.fillRect(px+m,py+m,s*0.22,s*0.22);
    ctx.fillRect(px+s-m-s*0.22,py+m,s*0.22,s*0.22);
    ctx.fillRect(px+m,py+s-m-s*0.22,s*0.22,s*0.22);
    ctx.fillRect(px+s-m-s*0.22,py+s-m-s*0.22,s*0.22,s*0.22);
  }
  ctx.strokeStyle="rgba(196,165,116,0.13)"; ctx.lineWidth=1;
  for(let x=0;x<=COLS;x++) if(x%3===0){ ctx.beginPath(); ctx.moveTo(x*s,0); ctx.lineTo(x*s,canvas.height); ctx.stroke(); }
  for(let y=0;y<=ROWS;y++) if(y%3===0){ ctx.beginPath(); ctx.moveTo(0,y*s); ctx.lineTo(canvas.width,y*s); ctx.stroke(); }
  for(const it of items){
    const cx=(it.x+0.5)*s, cy=(it.y+0.5)*s;
    const pulse=1+Math.sin(performance.now()/180+it.x)*0.08;
    if(it.kind==="lamp"){
      ctx.fillStyle="#F4C95D"; ctx.beginPath(); ctx.arc(cx,cy,s*0.22*pulse,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(244,201,93,0.25)"; ctx.beginPath(); ctx.arc(cx,cy,s*0.42*pulse,0,Math.PI*2); ctx.fill();
    } else if(it.kind==="roll"){
      ctx.fillStyle="#C4A574"; ctx.beginPath(); ctx.arc(cx,cy,s*0.28,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#1A1612"; ctx.beginPath(); ctx.arc(cx,cy,s*0.11,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle="#C45C26"; ctx.fillRect(cx-s*0.28,cy-s*0.14,s*0.56,s*0.28);
      ctx.fillStyle="#2A6B6B"; ctx.fillRect(cx-s*0.08,cy-s*0.2,s*0.22,s*0.14);
    }
  }
  for(let i=snake.length-1;i>=0;i--){
    const p=snake[i], px=p.x*s, py=p.y*s;
    ctx.fillStyle=i===0?"#E8D5B5":(i%2?"#C4A574":"#A88858");
    const pad=i===0?2:3.2, r=Math.max(3,s*0.22);
    roundRect(ctx,px+pad,py+pad,s-pad*2,s-pad*2,r); ctx.fill();
    if(i===0){
      ctx.fillStyle="#1A1612"; const [dx,dy]=DIR[dir];
      ctx.beginPath();
      ctx.arc(px+s*(0.5+dx*0.16)-3.2, py+s*(0.5+dy*0.16), 2.1, 0, Math.PI*2);
      ctx.arc(px+s*(0.5+dx*0.16)+3.2, py+s*(0.5+dy*0.16), 2.1, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle="#2A6B6B"; ctx.lineWidth=2; ctx.strokeRect(px+4,py+4,s-8,s-8);
    } else if(i%3===0){
      ctx.fillStyle="rgba(26,22,18,0.35)"; ctx.beginPath(); ctx.arc(px+s*0.5,py+s*0.5,s*0.1,0,Math.PI*2); ctx.fill();
    }
  }
  for(const pt of particles){
    ctx.globalAlpha=Math.max(0,pt.life); ctx.fillStyle=pt.color; ctx.fillRect(pt.x*s-1.5,pt.y*s-1.5,3,3); ctx.globalAlpha=1;
  }
  if(state==="play"){
    ctx.fillStyle="rgba(244,232,208,0.35)";
    ctx.font=Math.max(10,Math.floor(s*0.42))+"px Trebuchet MS,sans-serif";
    ctx.fillText("ruličky "+snake.length,8,canvas.height-8);
  }
}
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last=now;
  const dt=now-last; last=now;
  if(state==="play"){
    acc+=dt;
    while(acc>=tickMs){ acc-=tickMs; step(); if(state!=="play") break; }
    for(const pt of particles){ pt.x+=pt.vx*dt/400; pt.y+=pt.vy*dt/400; pt.life-=dt/520; }
    particles=particles.filter(p=>p.life>0);
  }
  draw();
}
requestAnimationFrame(loop);
function setDir(next){ if(state!=="play") return; if(OPP[dir]===next) return; queued=next; }
window.addEventListener("keydown",e=>{
  const map={ArrowUp:"U",ArrowDown:"D",ArrowLeft:"L",ArrowRight:"R",w:"U",s:"D",a:"L",d:"R",W:"U",S:"D",A:"L",D:"R"};
  if(map[e.key]){ e.preventDefault(); if(state==="menu") start(); else setDir(map[e.key]); }
  if((e.key==="Enter"||e.key===" ")&&state!=="play"){ e.preventDefault(); start(); }
},{passive:false});
let sx=0,sy=0;
canvas.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.hypot(dx,dy)<18) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?"R":"L"); else setDir(dy>0?"D":"U");
},{passive:true});
document.getElementById("play").onclick=start;
document.getElementById("again").onclick=start;
document.getElementById("home").onclick=()=>{ state="menu"; over.classList.add("hidden"); menu.classList.remove("hidden"); overlay.style.pointerEvents="auto"; };
document.querySelectorAll(".pads button").forEach(btn=>btn.addEventListener("click",()=>setDir(btn.dataset.d)));
reset(); draw();
})();
</script>
</body>
</html>
